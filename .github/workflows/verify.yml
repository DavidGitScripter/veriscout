name: ScoutRef source verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and audit tools
        run: python -m pip install -r requirements.txt pytest pip-audit
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Check browser script syntax
        run: node --check static/app.js
      - name: Run offline tests
        run: python -m pytest -q
      - name: Audit pinned dependencies
        run: python -m pip_audit --strict -r requirements.txt
